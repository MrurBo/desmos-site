<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Graph Browser - Desmos Graphs</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://www.desmos.com/api/v1.13/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
        <style>
            .calculator {
                width: 100%;
                height: 400px;
                margin: 20px 0;
            }
            .hero {
                background: linear-gradient(135deg, #1e88e5 0%, #1565c0 100%);
                color: white;
                padding: 4rem 0;
            }
            .card {
                transition: transform 0.2s;
            }
            .card:hover {
                transform: translateY(-5px);
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/"
                    >Desmos Graphs</a
                >
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a
                                class="nav-link "
                                href="/"
                                >Home</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                href="/graphs"
                                >Graphs</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link "
                                href="/about"
                                >About</a
                            >
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
    <h1 class="mb-4">Graph Browser</h1>
    <div class="mb-4">
        <div class="input-group mb-3">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search graphs..."
            />
            <button
                class="btn btn-outline-secondary"
                type="button"
                id="clearSearch"
            >
                Clear
            </button>
        </div>
        <div class="text-center mb-2">
            <button id="toggleTags" class="btn btn-sm btn-link d-none">
                Show more tags
            </button>
        </div>
    </div>

    <div id="graphsContainer" class="row g-4">
        <!-- Graphs will be dynamically inserted here -->
    </div>
</div>

<template id="graphCardTemplate">
    <div class="col-md-6 col-lg-4 graph-card">
        <div class="card h-100">
            <div class="calculator-preview" style="height: 200px">
                <iframe class="w-100 h-100 border-0"></iframe>
            </div>
            <div class="card-body">
                <h5 class="card-title"></h5>
                <p class="card-text description"></p>
                <div class="tags mb-2"></div>
                <a class="btn btn-primary view-graph" target="_blank"
                    >Open in Desmos</a
                >
            </div>
        </div>
    </div>
</template>

<style>
    .tag-badge {
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        cursor: pointer;
    }

    .calculator-preview {
        background-color: #f8f9fa;
        border-bottom: 1px solid rgba(0, 0, 0, 0.125);
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let graphs = [];
        let tagsData = null;
        let selectedTags = new Set();
        const graphsContainer = document.getElementById("graphsContainer");
        const searchInput = document.getElementById("searchInput");
        const clearSearch = document.getElementById("clearSearch");
        const template = document.getElementById("graphCardTemplate"); // Fetch graphs data    // Fetch both graphs and tags data
        Promise.all([
            fetch("/graphs.json").then((response) =>
                response.json(),
            ),
        ]).then(([graphsData]) => {
            graphs = graphsData.graphs;
            renderGraphs(searchInput.value);
        });

        function renderGraphs(searchTerm = "") {
            graphsContainer.innerHTML = "";

            const filteredGraphs = graphs.filter((graph) => {
                const matchesSearch =
                    !searchTerm ||
                    graph.title
                        .toLowerCase()
                        .includes(searchTerm.toLowerCase()) ||
                    graph.description
                        .toLowerCase()
                        .includes(searchTerm.toLowerCase());
                return matchesSearch;
            });

            filteredGraphs.forEach((graph) => {
                const clone = template.content.cloneNode(true);

                const card = clone.querySelector(".graph-card");
                const title = clone.querySelector(".card-title");
                const description = clone.querySelector(".card-text");
                const previewContainer = clone.querySelector(
                    ".calculator-preview",
                );

                title.textContent = graph.title;
                description.textContent = graph.description;
                // Add tags with descriptions from tags data

                if (!graph.graphLink.includes("/3d/")) {
                    const iframe = previewContainer.querySelector("iframe");
                    const embedParams = [
                        "embed",
                        "settingsMenu=0",
                        "zoomButtons=0",
                        "expressions=0",
                        "keypad=0",
                        "lockViewport=1",
                        "hideHorizontal=1",
                        "hideVertical=1",
                        "disableMouseInteraction=1",
                    ].join("&");
                    iframe.src = `${graph.graphLink}?${embedParams}`;
                }

                // Set up view button
                const viewButton = clone.querySelector(".view-graph");
                viewButton.href = graph.graphLink;
                graphsContainer.appendChild(clone);
            });
            // Initialize tooltips
            const tooltips = document.querySelectorAll(
                '[data-bs-toggle="tooltip"]',
            );
            tooltips.forEach((tooltip) => {
                new bootstrap.Tooltip(tooltip);
            });
        }

        // Event listeners
        searchInput.addEventListener("input", () => {
            renderGraphs(searchInput.value);
        });

        clearSearch.addEventListener("click", () => {
            searchInput.value = "";
            selectedTags.clear();
            document.querySelectorAll(".tag-filter").forEach((btn) => {
                btn.classList.remove("selected");
            });
            renderGraphs();
        });
    });
</script>


        <footer class="bg-dark text-white py-4 mt-5">
            <div class="container">
                <div class="row">
                    <div class="col-md-6">
                        <h5>Desmos Graphs</h5>
                        <p>A collection of interactive mathematical visualizations</p>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <p>
                            &copy; 2026
                            <a href="https://github.com/MrurBo">MrurBo</a>. All
                            rights reserved.
                        </p>
                    </div>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
