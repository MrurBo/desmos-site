<div class="hero">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="display-4">Interactive Math Visualizations</h1>
                <p class="lead">
                    Explore mathematical concepts through interactive Desmos
                    graphs
                </p>
                <a href="{{ site.baseurl }}/graphs" class="btn btn-light btn-lg"
                    >Explore Graphs</a
                >
            </div>
            <div class="col-md-6">
                <div id="calculator" class="calculator"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var elt = document.getElementById("calculator");
        var calculator = Desmos.GraphingCalculator(elt, {
            keypad: false,
            expressions: false,
            settingsMenu: false,
        });

        calculator.setExpression({
            id: "graph1",
            latex: "y=\\sin(x-t)",
            color: "#1565c0",
        });

        var t = 0;
        setInterval(function () {
            t += 0.1;
            calculator.setExpression({
                id: "graph1",
                latex: `y=\\sin(x-${t})`,
            });
        }, 50);
    });
</script>
